[package]
name = "wireguard-client-ps5"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
boringtun = "0.7.1"
ps5 = { git = "https://github.com/neokuze/ps5-rust", features = ["notify", "hw", "random"] }
ps5-std-rt = { git = "https://github.com/neokuze/ps5-rust" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
